trigger:
  branches:
    include:
      - feature/conditioned-pipeline

pool:
  name: LocalSonarPool
variables:
  major: 1
  minor: 0
  patch: $[counter('hello-world-patch', 0)]
  appVersion: '$(major).$(minor).$(patch)'
  buildConfiguration: Release

steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: Install .NET 8 SDK
    inputs:
      packageType: sdk
      version: '8.0.x'

  - task: SonarQubePrepare@8
    displayName: Prepare SonarQube analysis
    inputs:
      SonarQube: 'SonarQube-Local'
      scannerMode: 'dotnet'
      projectKey: 'azure-devops-dotnet-project'
      projectName: 'azure-devops-dotnet-project'
      projectVersion: '$(appVersion)'
  - bash: |
      FILTERED_PARAMS=$(python3 -c 'import json, os; p=json.loads(os.environ["SONARQUBE_SCANNER_PARAMS"]); p.pop("sonar.branch.name", None); print(json.dumps(p, separators=(",", ":")))')
      echo "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$FILTERED_PARAMS"
    displayName: Remove unsupported SonarQube branch parameter
  - script: |
      echo "Building application version: $(appVersion)"
    displayName: Print application version

  - task: DotNetCoreCLI@2
    displayName: Restore dependencies
    inputs:
      command: restore
      projects: 'HelloWorld/HelloWorld.csproj'

  - task: DotNetCoreCLI@2
    displayName: Build application
    inputs:
      command: build
      projects: 'HelloWorld/HelloWorld.csproj'
      arguments: '--configuration $(buildConfiguration) --no-restore -p:Version=$(appVersion)'

  - task: SonarQubeAnalyze@8
    displayName: Run SonarQube analysis

  - task: SonarQubePublish@8
    displayName: Publish SonarQube Quality Gate
    inputs:
      pollingTimeoutSec: '300'

  - task: DotNetCoreCLI@2
    displayName: Publish application
    inputs:
      command: publish
      publishWebProjects: false
      projects: 'HelloWorld/HelloWorld.csproj'
      arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory) -p:Version=$(appVersion)'
      zipAfterPublish: false
      modifyOutputPath: false

  - script: |
      dotnet $(Build.ArtifactStagingDirectory)/HelloWorld.dll
    displayName: Run application and show version

  - bash: |
      BRANCH_NAME="${BUILD_SOURCEBRANCH#refs/heads/}"
      SAFE_BRANCH_NAME="${BRANCH_NAME//\//-}"
      ARTIFACT_TAG="${SAFE_BRANCH_NAME}_$(appVersion)"

      echo "Application version: $(appVersion)"
      echo "Artifact name: ${ARTIFACT_TAG}"

      echo "##vso[task.setvariable variable=artifactTag]${ARTIFACT_TAG}"
      echo "##vso[build.addbuildtag]${ARTIFACT_TAG}"
    displayName: Create branch-version tag


  - script: |
      dotnet pack HelloWorld/HelloWorld.csproj \
        --configuration $(buildConfiguration) \
        --no-build \
        --output $(Build.ArtifactStagingDirectory)/nuget \
        -p:PackageVersion=$(appVersion)
    displayName: Create NuGet package from DLL

  - task: DotNetCoreCLI@2
    displayName: Upload NuGet package to Azure Artifacts
    inputs:
      command: push
      packagesToPush: '$(Build.ArtifactStagingDirectory)/nuget/*.nupkg'
      nuGetFeedType: internal
      publishVstsFeed: 'azure-devops-dotnet-project/hello-world-feed'

  - task: PublishPipelineArtifact@1
    displayName: Publish tagged NuGet artifact
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/nuget'
      artifact: '$(artifactTag)'
      publishLocation: pipeline
